name: exposed_admin_panel
description: 管理面板暴露公网
risk: 8
# 证据强度: high=端口级事实/跨表验证 medium=精确标题匹配 low=模糊匹配/聚合统计
confidence: high
tags: [exposure, admin, network]
collect:
  # 只收具名管理面板服务;泛化的 http-alt/http-proxy 由 dev_port_public 覆盖,
  # 否则同一资产会吃双份告警
  - table: ports
    where: "port IN (5601, 9200, 9300, 8086, 8083, 7001, 8000, 8080, 8443, 9090, 3000, 4040, 4200, 5000, 7000, 8008, 8888, 9000, 9090, 10000, 10443, 11211) AND service IN ('kibana', 'elasticsearch', 'influxdb', 'weblogic', 'grafana', 'adminer', 'tomcat', 'jenkins', 'admin')"
headline: "⚠️ 管理面板暴露公网: {ip}:{port} ({service})"
advice: |
  1. 加上 IP 白名单(只允许内网/VPN 访问)
  2. 启用强认证(MFA)
  3. 关闭不必要的服务
  4. 设置 fail2ban 防爆破
