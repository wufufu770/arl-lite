name: vnc_exposed
description: VNC 暴露公网(远程桌面爆破)
risk: 7
# 证据强度: high=端口级事实/跨表验证 medium=精确标题匹配 low=模糊匹配/聚合统计
confidence: high
tags: [vnc, exposure, brute_force]
collect:
  - table: ports
    where: "port = 5900 AND state = 'open'"
headline: "⚠️ VNC 暴露公网: {ip}:5900"
advice: |
  1. 不要暴露公网
  2. 启用 VNC 认证(强密码)
  3. 走 SSH 隧道
  4. 防火墙限制访问 IP
