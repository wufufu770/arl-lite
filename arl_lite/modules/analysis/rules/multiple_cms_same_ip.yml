name: multiple_cms_same_ip
description: 同一 IP 上多个不同 CMS(可能存在多个低安全资产)
risk: 5
tags: [cms, asset_diversity, network]
collect:
  - table: findings
    where: "finding_type = 'fingerprint' AND severity = 'info' AND title IN ('WordPress', 'Drupal', 'Joomla', 'Discuz', 'phpBB', 'vBulletin', 'Typecho', 'Magento', 'PrestaShop')"
headline: "💡 同一资产多 CMS 识别: {target}"
advice: |
  1. 确认这些 CMS 都是授权部署
  2. 定期更新所有 CMS 到最新版本
  3. 删掉未使用的 CMS 实例
