name: phpmyadmin_public
description: phpMyAdmin 暴露公网(数据库管理工具)
risk: 7
tags: [phpmyadmin, exposure, database, brute_force]
collect:
  - table: findings
    where: "title = 'phpMyAdmin'"
headline: "⚠️ phpMyAdmin 暴露公网: {target} (数据库管理工具)"
advice: |
  1. 加上 IP 白名单(只允许内网)
  2. 启用 Basic Auth
  3. 限制登录尝试次数
  4. 监控异常 SQL 操作
