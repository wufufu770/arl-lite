name: subdomain_count_high
description: workspace 内总子域数 ≥ 20(攻击面大)
risk: 4
# 证据强度: high=端口级事实/跨表验证 medium=精确标题匹配 low=模糊匹配/聚合统计
confidence: low
count_min: 20
tags: [subdomain, attack_surface, info]
collect:
  - table: domains
    where: "1=1"
headline: "💡 workspace 内子域数 ≥ 20(攻击面大,当前 {count} 个,关注废弃子域)"
advice: |
  1. 定期审计子域,识别废弃/未维护的
  2. 关注子域接管风险
  3. 启用 CSP 限制跨域
  4. 监控新增子域
