name: vnc_with_weak_auth
description: VNC 暴露在公网且无强认证
risk: 8
# 证据强度: high=端口级事实/跨表验证 medium=精确标题匹配 low=模糊匹配/聚合统计
confidence: high
tags: [vnc, exposure, brute_force, auth]
collect:
  - table: findings
    where: "title = 'VNC'"
cross_ref:
  - table: ports
    where: "port = 5900 AND state = 'open'"
    description: "VNC 端口开放"
exclusion:
  - table: findings
    where: "target = ports.ip AND title = 'Cloudflare'"
    description: "有 CDN 保护"
headline: "⚠️ VNC 公网暴露: {target}"
advice: |
  1. 不要把 VNC 暴露公网
  2. 走 SSH 隧道或 VPN
  3. 启用 VNC 强认证(密码 + 二次认证)
  4. 修改默认端口
