name: multiple_db_same_ip
description: 同一 IP 上多个数据库(数据集中暴露风险)
risk: 8
tags: [database, network, exposure, data_leak]
collect:
  - table: findings
    where: "title IN ('Redis', 'MongoDB', 'ElasticSearch', 'MySQL', 'PostgreSQL', 'Oracle', 'Neo4j', 'InfluxDB')"
headline: "⚠️ 同一目标多数据库: {target}"
advice: |
  1. 评估集中化风险(一次入侵 = 全部数据)
  2. 不同数据库用不同网络隔离
  3. 备份 + 异地容灾
