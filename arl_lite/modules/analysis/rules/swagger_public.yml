name: swagger_public
description: Swagger UI 暴露公网(API 文档泄露)
risk: 5
# 证据强度: high=端口级事实/跨表验证 medium=精确标题匹配 low=模糊匹配/聚合统计
confidence: medium
tags: [swagger, api_doc, exposure]
collect:
  - table: findings
    where: "title = 'Swagger UI'"
headline: "💡 Swagger UI 暴露公网: {target} (可能暴露内部 API 文档)"
advice: |
  1. 加上认证或 IP 白名单
  2. 生产环境不应有完整 API 文档
  3. 至少去掉危险接口的文档
