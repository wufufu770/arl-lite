[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arl-lite"
version = "0.7.8"
description = "灯塔 ARL 降级增强版:2G 内存友好的资产侦察工具,CLI/TUI 形态,集成 AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "arl-lite contributors"}]
keywords = ["security", "reconnaissance", "asset-discovery", "osint", "cli"]

# 依赖面:零。
#
# 这不是口号,是受门禁强制的结构事实:`arl_lite/**.py` 里没有任何
# 第三方 import(`no_thirdparty_import` 门禁每轮扫描 84 个文件)。
# 实测 2026-10:原先这里列的 7 个 `full` 可选依赖(typer/rich/httpx/
# pyyaml/apscheduler/textual/openpyxl)import 次数**全是 0** ——
# 没有任何代码会因它们的存在而走不同分支。它们是死元数据,已删除。
#
# 原因不只是"没用":留着会让 Dependabot / pip-audit 对 7 个与本项目
# 无关的包报 CVE,把真正该看的告警淹掉。详见 docs/DEP_AUDIT.md。
#
# ## 如果将来要加可选依赖
#
# 必须同时给出三样东西,缺一不可:
#   1. 启用分支(检测到就用)
#   2. 缺失时的降级行为(明确到"降级后少做什么")
#   3. 对应测试(验缺失时真的能降级,而不是启动就崩)
#
# 只声明不实现,比不声明更糟:它承诺了一个项目没有的能力。
dependencies = []

[project.optional-dependencies]
# 刻意为空。外部工具(subfinder/nmap/nuclei 等)**不是** pip 依赖 ——
# 它们是外部二进制,通过 shutil.which 探测 + subprocess 调用,缺失时
# 对应模块返回 success=False 并提示安装命令,不阻塞其他模块。
# 那是另一个类别的依赖,声明在这里会造成误导。
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[project.scripts]
arl-lite = "arl_lite.cli:main"

[tool.setuptools.packages.find]
include = ["arl_lite*"]

[tool.setuptools.package-data]
arl_lite = ["db/*.sql", "fingerprints/*.json"]

[tool.pytest.ini_options]
# async def test_xxx() 需要 auto 模式才会被 pytest-asyncio 接管。
# 之前没配这一项,9 个 async 测试全部被 skip 成 "async def functions are not natively supported",
# 覆盖率比看起来低很多。
asyncio_mode = "auto"
